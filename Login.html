<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<title>Inventec Network Management</title>

<style>

*{
box-sizing:border-box;
}

body{

margin:0;
font-family:Segoe UI, Arial, sans-serif;

background-image:url("img/5153829.jpg");
background-size:cover;
background-position:center;
background-repeat:no-repeat;

height:100vh;
display:flex;
justify-content:center;
align-items:center;

}

/* LOGIN CARD */

.login-card{

background:#ffffff;
padding:40px;

border-radius:10px;

width:360px;

box-shadow:0 15px 40px rgb(0, 0, 0);

text-align:center;

}

.logo{

width:220px;
margin-bottom:20px;

}

.login-card h2{

margin:10px 0 25px 0;
font-weight:500;

color:#000000;

}

.input-group{

margin-bottom:18px;
text-align:left;

}

label{

font-size:13px;
color:#000000;

}

input{

width:100%;
padding:10px;

margin-top:5px;

border-radius:5px;
border:1px solid #000000;

background:#ffffff;
color:#000;

}

input:focus{

outline:none;
border-color:#d00000;

}

button{

width:100%;
padding:12px;

background:#c40a0a;

border:none;

border-radius:5px;

color:white;

font-size:15px;

cursor:pointer;

margin-top:10px;

}

button:hover{

background:#cc0000;

}

.footer{

margin-top:20px;
font-size:12px;
color:#000000;

}

</style>

</head>

<body>

<div class="login-card">

<img src="/img/logo.png" class="logo">

<h2>Network Management System</h2>

<form onsubmit="return login()">

<div class="input-group">
<label>Username</label>
<input type="text" name="username" required placeholder="Enter your username">
</div>

<div class="input-group">
<label>Password</label>
<input type="password" name="password" required placeholder="Enter your password">
</div>

<button type="submit">Sign In</button>

</form>

<div class="footer">
Inventec Internal Network System
</div>

</div>

<script>

function login(){

let username = document.querySelector('[name="username"]').value;
let password = document.querySelector('[name="password"]').value;

if(username === "Guest" && password === "Guest+123"){

localStorage.setItem("logged","true");

window.location.href = "index.html";

}else{  

alert("Invalid username or password");

}

return false;

}

</script>

</body>

</html>
