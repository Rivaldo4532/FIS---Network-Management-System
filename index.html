<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<title>Inventec Network Management</title>

<link rel="stylesheet" href="styles.css">

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

</head>

<body>

<script>

if(localStorage.getItem("logged") !== "true"){
window.location.replace("Login.html");
}

</script>

<header style="position:relative; padding:20px; background:#111; color:white;">

<h1>Inventec Network Management System</h1>
<button class="logout-btn" onclick="logout()">
Logout
</button>

</header>

<section class="controls">

<input type="file" id="upload" accept=".xlsx">

<input type="text" id="search" placeholder="Search IP, node, MAC, device...">

<select id="lineFilter">
<option value="">All Lines</option>
</select>

<select id="areaFilter">
<option value="">All Areas</option>
</select>

</section>


<section class="dashboard">

<div>Total Nodes: <span id="totalNodes">0</span></div>
<div>Switch F112 Used: <span id="f112Used">0</span> / 48</div>
<div>Switch F113 Used: <span id="f113Used">0</span> / 48</div>
<div>Switch F111 Used: <span id="f111Used">0</span> / 48</div>
<div>Duplicate IPs: <span id="duplicateIPs">0</span></div>

</section>


<section class="network-map">

<h2>Network Map</h2>

<div class="zoom-controls">
<button onclick="zoomIn()">+</button>
<button onclick="zoomOut()">-</button>
</div>

<div class="map-container">

<img id="plantMap" src="img/Mapa conceptual (6).svg">

</div>

</section>


<table>

<thead>

<tr>
<th>Line</th>
<th>Area</th>
<th>Node</th>
<th>Switch</th>
<th>Port</th>
<th>IP</th>
<th>Device</th>
<th>Domain</th>
<th>MAC</th>
<th>Station</th>
</tr>

</thead>

<tbody id="tableBody"></tbody>

</table>


<footer style="text-align:center; font-size:11px; margin-top:30px; color:#666;">
Developed by Alejandro Castro Rivas – IT Department CIM
</footer>

<script src="app.js"></script>

</body>
</html>
